    async function generateSignature(params, secret) {
      const sortedParams = Object.keys(params).sort().map(key => `${key}=${params[key]}`).join('&');
      const stringToSign = sortedParams + secret;
      const encoder = new TextEncoder();
      const data = encoder.encode(stringToSign);
      const hashBuffer = await crypto.subtle.digest('SHA-1', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function uploadImageToCloudinary(file) {
      const timestamp = Math.round(new Date().getTime() / 1000);
      const signature = await generateSignature({ timestamp: timestamp }, CLOUDINARY_API_SECRET);

      const formData = new FormData();
      formData.append('file', file);
      formData.append('api_key', CLOUDINARY_API_KEY);
      formData.append('timestamp', timestamp);
      formData.append('signature', signature);

      try {
        const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();
        if (data.secure_url) {
          return data.secure_url;
        } else {
          console.error('Erro no upload do Cloudinary:', data);
          alert("Erro no Cloudinary: " + (data.error ? data.error.message : "Desconhecido"));
          return null;
        }
      } catch (error) {
        console.error('Erro ao conectar com o Cloudinary:', error);
        return null;
      }
    }

      const isAnonymous = document.getElementById("chatAnonymous").checked;
      const messageData = {

        time: Date.now(),

      if (replyTo) {

        input.placeholder = "Enviando...";
        input.disabled = true;
        
        uploadImageToCloudinary(selectedImage).then(imageUrl => {
          input.disabled = false;

          if (imageUrl) {

            messageData.text = text;
            db.collection("chat").add(messageData);
            cancelImage();
            input.value = "";
          }
        });

        input.value = "";
        document.getElementById("chatAnonymous").checked = false;
      }
    }

    function formatarDataMensagem(timestamp){
      const data = new Date(timestamp);
      const agora = new Date();
      const ontem = new Date();
      ontem.setDate(agora.getDate() - 1);
      const mesmoDia = data.toDateString() === agora.toDateString();
      const ehOntem = data.toDateString() === ontem.toDateString();
      const hora = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      if(mesmoDia) return `Hoje às ${hora}`;
      if(ehOntem) return `Ontem às ${hora}`;
      return data.toLocaleDateString('pt-BR') + ` às ${hora}`;
    }

    function renderMessages(append = false) {
      const box = document.getElementById("chatBox");
      const oldScrollHeight = box.scrollHeight;
      const oldScrollTop = box.scrollTop;

      if (!append) box.innerHTML = "";
      
      const fragment = document.createDocumentFragment();
      
      chatMessages.forEach(m => {
        if (document.getElementById(m.id)) return;

        let deleteBtn = (m.realNick === nick || nick === ADMIN_NICK) ? `<button onclick="deleteMsg('${m.id}', '${m.realNick || m.nick}')" style="background:none; border:none; color:#94a3b8; cursor:pointer; margin-left:10px;">🗑</button>` : "";
        let replyBtn = `<button onclick="setReply('${m.id}', '${m.nick}', '${(m.text || "Imagem").replace(/'/g, "\\\'")}')" style="background:none; border:none; color:#3b82f6; cursor:pointer;">↩ Responder</button>`;
        
        const div = document.createElement("div");
        div.className = "msg";
        div.id = m.id;
        
        let messageContent = "";
        if (m.reply) {
          messageContent += `<div class="reply-box" onclick="document.getElementById('${m.reply.id}').scrollIntoView({behavior:'smooth'})">
            <strong>${m.reply.user}</strong>: ${m.reply.text}
          </div>`;
        }
        if (m.imageUrl) {
          messageContent += `<img src="${m.imageUrl}" style="max-width:100%; max-height:300px; border-radius:8px; margin-top:5px; display:block;" onclick="window.open('${m.imageUrl}', '_blank')" />`;
        }
        if (m.text) {
          messageContent += `<div style="margin-top:5px;">${m.text}</div>`;
        }

        div.innerHTML = `<strong>${m.nick}:</strong> ${messageContent}<small>${formatarDataMensagem(m.time)} ${replyBtn} ${deleteBtn}</small>`;
        fragment.appendChild(div);
      });

      if (append) {
        box.prepend(fragment);
        box.scrollTop = box.scrollHeight - oldScrollHeight + oldScrollTop;
      } else {
        box.appendChild(fragment);
        box.scrollTop = box.scrollHeight;
      }
    }

    function listenChat() {
      if (unsubscribeChat) unsubscribeChat();
      
      unsubscribeChat = db.collection("chat")
        .orderBy("time", "desc")
        .limit(LIMIT)
        .onSnapshot(snapshot => {
          const newMessages = [];
          snapshot.docs.forEach(doc => {
            newMessages.push({ id: doc.id, ...doc.data() });
          });
          
          const loadedIds = new Set(chatMessages.map(m => m.id));
          const updates = newMessages.filter(m => !loadedIds.has(m.id));
          
          if (updates.length > 0) {
            chatMessages = [...chatMessages, ...updates].sort((a, b) => a.time - b.time);
            renderMessages();
          }

          if (snapshot.docs.length > 0) {
            lastDoc = snapshot.docs[snapshot.docs.length - 1];
          }
        });

      const box = document.getElementById("chatBox");
      box.onscroll = () => {
        if (box.scrollTop === 0 && !loadingMore && lastDoc) {
          loadMoreMessages();
        }
      };
    }

    async function loadMoreMessages() {
      loadingMore = true;
      const loadingDiv = document.createElement("div");
      loadingDiv.innerHTML = "Carregando mensagens antigas...";
      loadingDiv.style.textAlign = "center";
      loadingDiv.style.padding = "10px";
      loadingDiv.style.fontSize = "12px";
      document.getElementById("chatBox").prepend(loadingDiv);

      const snapshot = await db.collection("chat")
        .orderBy("time", "desc")
        .startAfter(lastDoc)
        .limit(LIMIT)
        .get();

      loadingDiv.remove();

      if (snapshot.docs.length > 0) {
        const olderMessages = [];
        snapshot.docs.forEach(doc => {
          olderMessages.push({ id: doc.id, ...doc.data() });
        });
        
        chatMessages = [...olderMessages, ...chatMessages].sort((a, b) => a.time - b.time);
        lastDoc = snapshot.docs[snapshot.docs.length - 1];
        renderMessages(true);
      }
      loadingMore = false;
    }

            const url = await uploadImageToCloudinary(adPhotos[i]);
            if (url) {
              finalUrls[i] = url;
            } else {
              throw new Error(`Falha no upload da imagem ${i+1}`);
            }
          }
        }

        const validPhotos = finalUrls.filter(u => u !== null);
        if (validPhotos.length === 0) {
          alert("O anúncio precisa de pelo menos uma foto!");
          btn.disabled = false;
          btn.textContent = "Salvar";
          return;
        }

        const adData = {
          title,
          price,
          desc,
          whatsapp,
          photos: validPhotos,
          nick: isAnonymous ? "Anônimo 👤" : nick,
          realNick: nick || "Anônimo",
          time: Date.now(),
          anonymous: isAnonymous
        };

        btn.textContent = "Salvando dados...";
        if (adId) {
          await db.collection("desapega").doc(adId).update(adData);
          alert("✅ Anúncio atualizado com sucesso!");
        } else {
          await db.collection("desapega").add(adData);
          alert("✅ Anúncio publicado com sucesso!");
        }

        resetAdForm();
        document.getElementById("adAnonymous").checked = false;
        toggleDesapegaForm();
      } catch (e) {
        console.error("Erro detalhado:", e);
        alert("❌ Erro ao salvar: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Salvar";
      }
    }

    function editAd(id, data) {
      resetAdForm();
      document.getElementById("adId").value = id;
      document.getElementById("adTitle").value = data.title;
      document.getElementById("adPrice").value = data.price;
      document.getElementById("adDesc").value = data.desc;
      document.getElementById("adWhatsapp").value = data.whatsapp;
      document.getElementById("adFormTitle").textContent = "Editar Anúncio";
      
      if (data.photos && data.photos.length > 0) {
        data.photos.forEach((url, i) => {
          if (i < 2) {
            existingPhotos[i] = url;
            const preview = document.getElementById("adPreview" + (i + 1));
            preview.src = url;
            preview.style.display = "block";
          }
        });
      }
      
      document.getElementById("desapegaForm").style.display = "block";
      document.getElementById("desapegaPage").scrollTop = 0;
    }

    function listenAds() {
      if (unsubscribeAds) unsubscribeAds();
      
      unsubscribeAds = db.collection("desapega")
        .orderBy("time", "desc")
        .onSnapshot(snapshot => {
          const adList = document.getElementById("adList");
          adList.innerHTML = "";
          
          if (snapshot.empty) {
            adList.innerHTML = "<p style='text-align:center;'>Nenhum anúncio encontrado.</p>";
            return;
          }

          snapshot.forEach(doc => {
            const ad = doc.data();
            const id = doc.id;
            const card = document.createElement("div");
            card.className = "desapega-card";
            
            let photosHtml = "";
            if (ad.photos && ad.photos.length > 0) {
              photosHtml = `<div style="display:grid; grid-template-columns: ${ad.photos.length > 1 ? '1fr 1fr' : '1fr'}; gap:5px;">
                ${ad.photos.map(p => `<img src="${p}" class="desapega-img" style="height:150px;" onclick="window.open('${p}', '_blank')" />`).join('')}
              </div>`;
            }

            let actionsBtn = (ad.realNick === nick || nick === ADMIN_NICK) ? `
              <div style="display:flex; gap:5px; margin-top:10px;">
                <button onclick='editAd("${id}", ${JSON.stringify(ad).replace(/'/g, "&apos;")})' style="background:#3b82f6; border:none; color:white; padding:8px; border-radius:5px; font-size:12px; flex:1;">✏️ Editar</button>
                <button onclick="deleteAd('${id}')" style="background:#dc2626; border:none; color:white; padding:8px; border-radius:5px; font-size:12px; flex:1;">🗑 Excluir</button>
              </div>
            ` : "";

            let repliesHtml = "";
            if (ad.replies && ad.replies.length > 0) {
              repliesHtml = `<div style="margin-top:10px; padding-left:10px; border-left:2px solid #f59e0b;">
                ${ad.replies.map((r, index) => `
                  <div style="font-size:13px; background:rgba(255,255,255,0.05); padding:5px; border-radius:5px; margin-bottom:5px;">
                    <div style="display:flex; justify-content:space-between;">
                      <strong>${r.nick}:</strong>
                      ${(r.realNick === nick || nick === ADMIN_NICK) ? `<span onclick="deleteAdReply('${id}', ${index})" style="cursor:pointer; color:#dc2626; font-size:10px;">🗑</span>` : ""}
                    </div>
                    ${r.text}
                  </div>
                `).join('')}
              </div>`;
            }

            card.innerHTML = `
              ${photosHtml}
              <h3 style="margin:10px 0 5px 0;">${ad.title}</h3>
              <p class="desapega-price">${ad.price}</p>
              <p style="font-size:14px; color:#cbd5e1; white-space:pre-line; margin-bottom:10px;">${ad.desc}</p>
              <p style="font-size:11px; color:#94a3b8;">Postado por: ${ad.nick}</p>
              
              <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
                <a href="https://api.whatsapp.com/send?phone=55${ad.whatsapp.replace(/\D/g, '')}" class="desapega-contact" target="_blank" style="margin-top:0; flex:1; text-align:center;">📱 WhatsApp</a>
                <button onclick="showReplyInput('${id}')" style="background:#3b82f6; padding:8px 15px; border-radius:20px; font-size:14px; font-weight:bold; border:none; color:white; cursor:pointer;">💬 Responder</button>
              </div>

              <div id="replyInputArea_${id}" style="display:none; margin-top:10px;">
                <div style="display:flex; gap:5px;">
                  <input type="text" id="replyInput_${id}" placeholder="Escreva sua resposta..." style="flex:1; padding:15px; border-radius:10px; border:none; background:#e5e7eb; color:#1f2937; font-size:18px;" />
                  <button onclick="sendAdReply('${id}')" style="background:#22c55e; border:none; color:white; padding:15px; border-radius:10px; font-size:18px;">➤</button>
                </div>
              </div>

              ${repliesHtml}
              ${actionsBtn}
            `;
            adList.appendChild(card);
          });
        });
    }

    function showReplyInput(id) {
      const area = document.getElementById(`replyInputArea_${id}`);
      area.style.display = area.style.display === "none" ? "block" : "none";
      if (area.style.display === "block") {
        document.getElementById(`replyInput_${id}`).focus();
      }
    }

    async function sendAdReply(adId) {
      const input = document.getElementById(`replyInput_${adId}`);
      const text = input.value.trim();
      if (!text) return;
      if (!nick) {
        alert("Você precisa definir um Nick para responder!");
        return;
      }

      try {
        const adRef = db.collection("desapega").doc(adId);
        const doc = await adRef.get();
        if (doc.exists) {
          const replies = doc.data().replies || [];
          replies.push({
            nick: nick,
            realNick: nick,
            text: text,
            time: Date.now()
          });
          await adRef.update({ replies: replies });
          input.value = "";
          document.getElementById(`replyInputArea_${adId}`).style.display = "none";
        }
      } catch (e) {
        console.error("Erro ao responder:", e);
        alert("Erro ao enviar resposta: " + e.message);
      }
    }

    // ✅ CORREÇÃO 4: Função deleteAdReply() - Sem notificação
    async function deleteAdReply(adId, index) {
      try {
        const adRef = db.collection("desapega").doc(adId);
        const doc = await adRef.get();
        if (doc.exists) {
          const replies = doc.data().replies || [];
          replies.splice(index, 1);
          await adRef.update({ replies: replies });
        }
      } catch (e) {
        console.error("Erro ao remover resposta:", e);
      }
    }

    // ✅ CORREÇÃO 5: Função deleteAd() - Sem notificação
    function deleteAd(id) {
      db.collection("desapega").doc(id).delete();
    }

    window.onload = () => {
      atualizarDataBar();
      loadAllContent();
      listenContentChanges();
      if(nick){
        document.getElementById("nickArea").style.display="none";
        document.getElementById("chatArea").style.display="block";
        listenChat();
      }
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').then(reg => {
        console.log("SW registrado");
      }).catch(err => console.log("Erro SW:", err));
    }
  </script>
</body>
</html>
