          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ action: 'skipWaiting' });
              }
            });
          });
        }).catch(console.error);

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.ready.then(reg => reg.update());
          }
        });
      }
    }

    function formatarDataMensagem(timestamp){
      const data = new Date(timestamp); const agora = new Date(); const ontem = new Date(); ontem.setDate(agora.getDate() - 1);
      const mesmoDia = data.toDateString() === agora.toDateString(); const ehOntem = data.toDateString() === ontem.toDateString();
      const hora = data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      if(mesmoDia) return `Hoje às ${hora}`; if(ehOntem) return `Ontem às ${hora}`;
      return data.toLocaleDateString('pt-BR') + ` às ${hora}`;
    }

    function renderMessages(append = false) {
      const box = document.getElementById("chatBox"); const oldScrollHeight = box.scrollHeight; const oldScrollTop = box.scrollTop;
      if (!append) box.innerHTML = ""; const fragment = document.createDocumentFragment();
      chatMessages.forEach(m => {
        if (document.getElementById(m.id)) return;
        let deleteBtn = (m.realNick === nick || nick === ADMIN_NICK) ? `<button onclick="deleteMsg('${m.id}', '${m.realNick || m.nick}')" style="background:none; border:none; color:#94a3b8; cursor:pointer; margin-left:10px;">🗑</button>` : "";
        let replyBtn = `<button onclick="setReply('${m.id}', '${m.nick}', '${(m.text || "Imagem").replace(/'/g, "\\\'")}')" style="background:none; border:none; color:#3b82f6; cursor:pointer;">↩ Responder</button>`;
        const div = document.createElement("div"); div.className = "msg"; div.id = m.id;
        let messageContent = "";
        if (m.reply) { messageContent += `<div class="reply-box" onclick="document.getElementById('${m.reply.id}').scrollIntoView({behavior:'smooth'})"><strong>${m.reply.user}</strong>: ${m.reply.text}</div>`; }
        if (m.imageUrl) { messageContent += `<img src="${m.imageUrl}" style="max-width:100%; max-height:300px; border-radius:8px; margin-top:5px; display:block;" onclick="window.open('${m.imageUrl}', '_blank')" />`; }
        if (m.text) { messageContent += `<div style="margin-top:5px;">${m.text}</div>`; }
        div.innerHTML = `<strong>${m.nick}:</strong> ${messageContent}<small>${formatarDataMensagem(m.time)} ${replyBtn} ${deleteBtn}</small>`;
        fragment.appendChild(div);
      });
      if (append) { box.prepend(fragment); box.scrollTop = box.scrollHeight - oldScrollHeight + oldScrollTop; } 
      else { box.appendChild(fragment); box.scrollTop = box.scrollHeight; }
    }

    function listenChat() {
      if (unsubscribeChat) unsubscribeChat();
      unsubscribeChat = db.collection("chat").orderBy("time", "desc").limit(LIMIT).onSnapshot(snapshot => {
        const newMessages = []; snapshot.docs.forEach(doc => { newMessages.push({ id: doc.id, ...doc.data() }); });
        const loadedIds = new Set(chatMessages.map(m => m.id)); const updates = newMessages.filter(m => !loadedIds.has(m.id));
        if (updates.length > 0) { chatMessages = [...chatMessages, ...updates].sort((a, b) => a.time - b.time); renderMessages(); }
        if (snapshot.docs.length > 0) { lastDoc = snapshot.docs[snapshot.docs.length - 1]; }
      });
      const box = document.getElementById("chatBox"); box.onscroll = () => { if (box.scrollTop === 0 && !loadingMore && lastDoc) { loadMoreMessages(); } };
    }

    async function loadMoreMessages() {
      loadingMore = true; const box = document.getElementById("chatBox");
      const snapshot = await db.collection("chat").orderBy("time", "desc").startAfter(lastDoc).limit(LIMIT).get();
      if (snapshot.docs.length > 0) {
        const olderMessages = []; snapshot.docs.forEach(doc => { olderMessages.push({ id: doc.id, ...doc.data() }); });
        chatMessages = [...olderMessages, ...chatMessages].sort((a, b) => a.time - b.time); lastDoc = snapshot.docs[snapshot.docs.length - 1]; renderMessages(true);
      }
      loadingMore = false;
    }

    function dataURLtoFile(dataurl, filename) {
      const arr = dataurl.split(','); const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n);
      while (n--) u8arr[n] = bstr.charCodeAt(n); return new File([u8arr], filename, { type: mime });
    }

      atualizarDataBar(); loadAllContent(); listenContentChanges(); setupPWAUpdate(); 
      if(nick){ document.getElementById("nickArea").style.display="none"; document.getElementById("chatArea").style.display="block"; listenChat(); } 
    };
