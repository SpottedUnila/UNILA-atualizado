      internet: "📶 Configuração geral:\n• Método EAP: PEAP\n• Autenticação Fase 2: MSCHAPV2",
      estude: "UNILA - Instituição pública, gratuita e voltada à integração Latino-Americana.",
      enem: "https://enem.inep.gov.br/participante/#!/", noticias: "Notícias da UNILA e região.",
      upa: "📍 UPA João Samek\nAv. Gramado, 450\n📞 (45) 2105-8000"
    };

    const buttonTitles = {
      portal_unila: "🌐 Portal Oficial da UNILA", sigaa: "📚 Sistema Acadêmico SIGAA",
      email: "📧 E-mail Institucional", google: "🔎 Pesquisa Google",
      instagram: "📸 Instagram UNILA", facebook: "📘 Facebook UNILA",
      biblioteca: "📖 Biblioteca UNILA", intercampi: "🚌 Transporte Intercampi",
      smartec: "💻 Smart Tech", editais: "📄 Editais Oficiais",
      emergencia: "🚨 Telefones de Emergência", enderecos: "🏫 Endereços dos Campus",
      ru: "🍽️ Restaurantes Universitários", grupo_facebook: "👥 Grupo no Facebook",
      dev: "👨‍💻 Desenvolvedor", internet: "🌐 Internet UNILA",
      estude: "🎓 Estude na UNILA", enem: "📝 ENEM – Página do Participante",
      noticias: "📰 Notícias", upa: "🏥 Hospitais de Emergência 24h (UPA)"
    };

    let contentCache = {};

    async function loadAllContent() {
      try {
        const snapshot = await db.collection('admin_content').get();
        snapshot.forEach(doc => { contentCache[doc.id] = doc.data().value; });
      } catch(e) { console.log("Erro ao carregar conteúdos:", e); }
    }

    function listenContentChanges() {
      db.collection('admin_content').onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added' || change.type === 'modified') {
            contentCache[change.doc.id] = change.doc.data().value;
          }
        });
      });
    }

    async function openDynamic(id, type) {
      let value = contentCache[id] || defaultContent[id] || '';
      if (type === 'link') { window.open(value, "_blank"); }
      else {
        document.getElementById("home").style.display = "none";
        document.querySelectorAll(".page").forEach(p => p.style.display = "none");
        document.getElementById("dynamicTitle").textContent = buttonTitles[id] || id;
        document.getElementById("dynamicContent").textContent = value;
        document.getElementById("dynamicPage").style.display = "block";
      }
    }

    // Chat Logic
    async function saveNick(){
      const input = document.getElementById("nickInput").value.trim();
      if(!input || input.length < 2) { alert("❌ Nick inválido!"); return; }
      nick = input;
      localStorage.setItem("chat_nick", nick);
      document.getElementById("nickArea").style.display = "none";
      document.getElementById("chatArea").style.display = "block";
      if(nick === ADMIN_NICK) document.getElementById("changeNickBtn").style.display = "block";
      listenChat();
    }

    function changeNick(){
      localStorage.removeItem("chat_nick");
      nick = "";
      document.getElementById("chatArea").style.display = "none";
      document.getElementById("nickArea").style.display = "block";
      document.getElementById("changeNickBtn").style.display = "none";
    }

    function deleteMsg(id, msgNick){
      if(msgNick === nick || nick === ADMIN_NICK) {
        db.collection("chat").doc(id).delete();
      }
    }

    function sendMessage(){
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text && !selectedImage) return;
      const isAnonymous = document.getElementById("chatAnonymous").checked;
      const data = {
        nick: isAnonymous ? "Anônimo 👤" : nick,
        realNick: nick,
        time: Date.now(),
        text: text
      };
      if (selectedImage) {
        uploadImageToCloudinary(selectedImage).then(url => {
          if (url) { data.imageUrl = url; db.collection("chat").add(data); }
          cancelImage();
        });
      } else { db.collection("chat").add(data); }
      input.value = "";
    }

    function renderMessages() {
      const box = document.getElementById("chatBox");
      box.innerHTML = "";
      chatMessages.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg";
        let del = (m.realNick === nick || nick === ADMIN_NICK) ? `<span onclick="deleteMsg('${m.id}', '${m.realNick}')" style="cursor:pointer; color:red; margin-left:10px;">🗑</span>` : "";
        div.innerHTML = `<strong>${m.nick}:</strong> ${m.text || ""} ${m.imageUrl ? `<img src="${m.imageUrl}" style="max-width:100%; border-radius:8px; display:block; margin-top:5px;">` : ""} ${del}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function listenChat() {
      if (unsubscribeChat) unsubscribeChat();
      unsubscribeChat = db.collection("chat").orderBy("time", "desc").limit(LIMIT).onSnapshot(snapshot => {
        chatMessages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).reverse();
        renderMessages();
      });
    }

    // Desapega Logic
    function toggleDesapegaForm() {
      const f = document.getElementById("desapegaForm");
      f.style.display = f.style.display === "block" ? "none" : "block";
    }

    async function saveAd() {
      const title = document.getElementById("adTitle").value.trim();
      const price = document.getElementById("adPrice").value.trim();
      const whatsapp = document.getElementById("adWhatsapp").value.trim();
      if(!title || !price || !whatsapp) { alert("Preencha tudo!"); return; }
      const isAnon = document.getElementById("adAnonymous").checked;
      
      let finalUrls = [null, null];
      for (let i = 0; i < 2; i++) {
        if (adPhotos[i]) {
          const url = await uploadImageToCloudinary(adPhotos[i]);
          if (url) finalUrls[i] = url;
        }
      }

      const data = {
        title, price, whatsapp, 
        desc: document.getElementById("adDesc").value,
        photos: finalUrls.filter(u => u !== null),
        nick: isAnon ? "Anônimo 👤" : nick,
        realNick: nick,
        time: Date.now()
      };
      await db.collection("desapega").add(data);
      resetAdForm();
      toggleDesapegaForm();
    }

    function resetAdForm() {
      document.getElementById("adId").value = "";
      document.getElementById("adTitle").value = "";
      document.getElementById("adPrice").value = "";
      document.getElementById("adDesc").value = "";
      document.getElementById("adWhatsapp").value = "";
      document.getElementById("adPreview1").style.display = "none";
      document.getElementById("adPreview2").style.display = "none";
      adPhotos = [null, null];
    }

    function deleteAd(id) {
      db.collection("desapega").doc(id).delete();
    }

    function listenAds() {
      if (unsubscribeAds) unsubscribeAds();
      unsubscribeAds = db.collection("desapega").orderBy("time", "desc").onSnapshot(snapshot => {
        const list = document.getElementById("adList");
        list.innerHTML = "";
        snapshot.forEach(doc => {
          const ad = doc.data();
          const id = doc.id;
          const card = document.createElement("div");
          card.className = "desapega-card";
          
          let photosHtml = "";
          if (ad.photos && ad.photos.length > 0) {
            photosHtml = `<img src="${ad.photos[0]}" class="desapega-img" onclick="window.open('${ad.photos[0]}', '_blank')" />`;
          }

          let actionBtns = (ad.realNick === nick || nick === ADMIN_NICK) ? `
            <div class="action-btns">
              <button class="btn-action btn-edit" onclick='editAd("${id}", ${JSON.stringify(ad).replace(/'/g, "&apos;")})'>✏️ Editar</button>
              <button class="btn-action btn-delete" onclick="deleteAd('${id}')">🗑️ Excluir</button>
            </div>
          ` : "";

          card.innerHTML = `
            ${photosHtml}
            <h3 style="margin:10px 0 5px 0;">${ad.title}</h3>
            <p class="desapega-price">${ad.price}</p>
            <p style="font-size:14px; color:#cbd5e1; white-space:pre-line; margin-bottom:10px;">${ad.desc}</p>
            <p style="font-size:11px; color:#94a3b8;">Postado por: ${ad.nick}</p>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
              <a href="https://api.whatsapp.com/send?phone=55${ad.whatsapp.replace(/\D/g, '')}" class="desapega-contact" target="_blank">📱 WhatsApp</a>
              <button style="background:#475569; border:none; color:white; padding:12px; border-radius:15px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;">💬 Responder</button>
            </div>
            ${actionBtns}
          `;
          list.appendChild(card);
        });
      });
    }

    async function uploadImageToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'ml_default');
      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
        const data = await res.json();
        return data.secure_url;
      } catch (e) { return null; }
    }

    function handleAdImageSelect(event, index) {
      const file = event.target.files[0];
      if (file) {
        adPhotos[index-1] = file;
        const reader = new FileReader();
        reader.onload = (e) => {
          const preview = document.getElementById("adPreview" + index);
          preview.src = e.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    function handleImageSelect(e) { selectedImage = e.target.files[0]; }
    function cancelImage() { selectedImage = null; }
    function goHome() {
      document.getElementById("home").style.display = "grid";
      document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    }
    function openPage(id) {
      document.getElementById("home").style.display = "none";
      document.querySelectorAll(".page").forEach(p => p.style.display = "none");
      document.getElementById(id).style.display = "block";
      if(id === 'chatPage') listenChat();
      if(id === 'desapegaPage') listenAds();
    }

    window.onload = () => { loadAllContent(); listenContentChanges(); if(nick) { openPage('chatPage'); } };
  </script>
</body>
</html>
