<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4">
  <meta name="theme-color" content="#000000">
  <title>Horário Intercampi — Spotted Unila</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b0612; color: #fff; font-family: Arial, sans-serif; }
    body { padding: 14px; }
    main { width: 100%; max-width: 1400px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(18px, 4vw, 28px); }
    a { color: #ddd6fe; }
    .back { display: inline-block; padding: 9px 12px; border: 1px solid #6d28d9; border-radius: 9px; text-decoration: none; background: #24103c; white-space: nowrap; }
    .frame { overflow: auto; border: 1px solid #4c1d95; border-radius: 12px; background: #fff; }
    img { display: block; width: 100%; height: auto; min-width: 720px; }
    .note { margin: 10px 0 0; color: #c4b5fd; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Horário Intercampi</h1>
      <a class="back" href="./index.html">Voltar</a>
    </header>
    <div class="frame">
      <img src="./horario-intercampi.jpg" alt="Quadro de horários do serviço interunidades da Unila" loading="eager">
    </div>
    <p class="note">Imagem oficial do quadro de horários. Deslize horizontalmente para ampliar e consultar os horários.</p>
  </main>
</body>
</html>
