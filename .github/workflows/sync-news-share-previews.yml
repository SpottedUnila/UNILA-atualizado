name: Sincronizar prévias das notícias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: news-share-previews
  cancel-in-progress: false

jobs:
  sync-news-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar prévias estáticas das notícias públicas
        run: python scripts/generate_news_previews.py

      - name: Publicar mudanças e solicitar build do Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A -- share/news
          if git diff --cached --quiet; then
            echo "As prévias já estão atualizadas."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza prévias das notícias"
          git push origin HEAD:main

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
          cat "$response_file"
          if [ "$status" != "201" ]; then
            echo "Solicitação ao build do GitHub Pages falhou com HTTP ${status}." >&2
            exit 1
          fi
          echo "Build do GitHub Pages solicitado após o commit das prévias."
