name: Deploy Firebase

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependências das Functions
        working-directory: functions
        run: npm ci

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_UNILA }}'

      - name: Publicar regras e Cloud Functions
        # As regras já foram publicadas pelo Firebase Console.
        # Publicar apenas Functions evita exigir firebaserules.projects:test
        # da conta de serviço do GitHub Actions.
        run: npx --yes firebase-tools deploy --project app-unila --non-interactive --only functions
